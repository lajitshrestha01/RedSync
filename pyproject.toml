[project]
name = "reddit-os"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.3.1",
    "praw>=8.0.3",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib"
]
markers=[
    "slow: Tests that take a long time",
    
]
